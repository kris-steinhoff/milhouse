# Optional local mirror of .github/workflows/ci.yml.
#
# CI is the canonical check suite. Nothing here is required to contribute, and
# nothing here decides whether a change is good: it only moves CI's answer
# earlier, onto the developer's machine. Installing it is still recommended,
# because the same command wires the beads hooks that keep issue data in sync.
#
# Install with: uv run pre-commit install
# The install hook types below are wired automatically by that one command.
#
# See .agents/skills/ci-checks/SKILL.md before changing this file or ci.yml.
default_install_hook_types:
  - pre-commit
  - commit-msg
  - prepare-commit-msg
  - pre-push
  - post-checkout
  - post-merge
default_stages: [pre-commit]

# .beads/ is generated and maintained by bd; leave its formatting alone.
exclude: '^\.beads/'

repos:
  # Mirrors the hygiene job. CI reimplements these checks with git and shell,
  # so the two share no version to keep in step.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      # Mirrors the ruff job. These run the ruff from uv.lock rather than a
      # pinned ruff-pre-commit rev, so the local and CI versions cannot drift.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      # Mirrors the prettier job. pre-commit provisions node and npm-installs
      # prettier itself, so the repo needs no local node toolchain. Keep the
      # version in step with PRETTIER_VERSION in ci.yml. File selection comes
      # from .prettierignore, which prettier reads in both places.
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies: [prettier@3.9.6]
        types_or: [markdown, yaml, json]

  # Mirrors the commit-messages job, and enforces
  # .agents/skills/commit-messages/SKILL.md.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      # Delegate to the hook scripts bd generates, so beads keeps owning its
      # own timeout and exit-code handling. These used to run via
      # core.hooksPath, which pre-commit refuses to coexist with. They have no
      # CI counterpart: they sync issue data, they do not check the tree.
      - id: beads-pre-commit
        name: beads (pre-commit)
        entry: .beads/hooks/pre-commit
        language: script
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: beads-prepare-commit-msg
        name: beads (prepare-commit-msg)
        entry: .beads/hooks/prepare-commit-msg
        language: script
        stages: [prepare-commit-msg]
        always_run: true
      - id: beads-pre-push
        name: beads (pre-push)
        entry: .beads/hooks/pre-push
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: beads-post-checkout
        name: beads (post-checkout)
        entry: .beads/hooks/post-checkout
        language: script
        stages: [post-checkout]
        always_run: true
        pass_filenames: false
      - id: beads-post-merge
        name: beads (post-merge)
        entry: .beads/hooks/post-merge
        language: script
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      # Mirrors the ty and test jobs. Both run the versions from uv.lock. They
      # are slow, so they wait for push and committing stays fast. The herdr and
      # beads markers are integration tests that need live servers; they are
      # excluded here and expected to be run deliberately.
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest -m "not herdr and not beads"
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
