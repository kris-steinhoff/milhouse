[project]
name = "milhouse"
version = "0.1"
description = "Agentic AI orchestrator: decompose a task into tracked issues, then drive a ralph loop over them."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kris Steinhoff" }]
keywords = ["agent", "orchestrator", "ralph-loop", "beads", "herdr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["typer>=0.12", "pydantic>=2.7", "jinja2>=3.1"]

[project.scripts]
milhouse = "milhouse.cli:main"

[project.urls]
Homepage = "https://github.com/kris-steinhoff/milhouse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milhouse"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=4",
    "ty>=0.0.63",
    "pytest-github-actions-annotate-failures>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "herdr: integration tests that drive the live herdr server (no agents spawned)",
    "beads: integration tests that drive a real scratch bd database",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "D", "RUF"]
ignore = [
    # D203/D213 conflict with D211/D212, which is the style used here.
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves by name; module/class docstrings are still required.
"tests/*" = ["D102", "D103"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"
